name: Deploy — Staging

on:
  repository_dispatch:
    types: [deploy-staging]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: staging)'
        required: false
        default: 'staging'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag || 'staging' }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Hetzner staging
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /opt/decisionmesh/infra

            echo "Pulling latest staging image..."
            docker pull ghcr.io/decimeshi/decisionmesh:${{ steps.tag.outputs.tag }}

            sed -i 's|API_IMAGE=.*|API_IMAGE=ghcr.io/decimeshi/decisionmesh:${{ steps.tag.outputs.tag }}|' .env.staging

            echo "Recreating staging API..."
            docker compose -f backend/docker-compose.staging.yml --env-file .env.staging \
              up -d --no-deps --force-recreate api

            echo "Waiting for dm-api-staging to report healthy on /health..."
            # Same gap as prod had: dm-api-staging has no docker-level healthcheck,
            # so `up -d` reports success the moment the process starts even if it
            # then crash-loops. Staging's api listens on 8081 (not 8080) and sits
            # on the decisionmesh-staging_internal network — its base image has
            # neither curl nor wget, so check via a disposable curl container.
            HEALTHY=false
            for i in $(seq 1 12); do
              if docker run --rm --network decisionmesh-staging_internal curlimages/curl:latest \
                   -sf http://api:8081/health > /dev/null 2>&1; then
                HEALTHY=true
                break
              fi
              echo "  attempt $i/12: not healthy yet, waiting 5s..."
              sleep 5
            done

            echo "=== Staging API logs ==="
            docker logs dm-api-staging --tail 50

            if [ "$HEALTHY" != "true" ]; then
              echo "::error::dm-api-staging did not report healthy on /health within 60s — see logs above for the actual boot failure."
              exit 1
            fi
            echo "dm-api-staging is healthy."
