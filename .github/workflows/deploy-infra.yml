name: Deploy — Infra Changes

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/Caddyfile'
      - 'backend/docker-compose*.yml'
      - 'backend/config/**'
      - 'scripts/**'

  workflow_dispatch:

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy infra changes to Hetzner
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'ENDSSH'
            set -e
            cd /opt/decisionmesh/infra

            echo "=== Pulling latest infra changes ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Reloading Caddy ==="
            docker compose -f backend/docker-compose.gateway.yml restart

            echo "=== Reloading Prometheus ==="
            docker compose -f backend/docker-compose.monitoring.yml up -d --force-recreate prometheus

            echo "=== Reconnecting networks ==="
            docker network connect decisionmesh_internal decisionmesh-prometheus 2>/dev/null || true
            docker network connect decisionmesh-staging_internal decisionmesh-prometheus 2>/dev/null || true
            docker network connect decisionmesh_internal decisionmesh-grafana 2>/dev/null || true
            docker network connect decisionmesh-staging_internal decisionmesh-grafana 2>/dev/null || true

            echo "=== Verifying health ==="
            sleep 10
            curl -sf https://api.decimeshi.com/health && echo "Prod API: OK" || echo "Prod API: WARN"
            curl -sf https://api-staging.decimeshi.com/health && echo "Staging API: OK" || echo "Staging API: WARN"

            echo "=== Infra deploy complete ==="
          ENDSSH
