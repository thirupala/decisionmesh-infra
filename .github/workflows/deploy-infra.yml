name: Deploy — Infra Changes

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/Caddyfile'
      - 'backend/docker-compose*.yml'
      - 'backend/config/**'
      - 'scripts/**'

  workflow_dispatch:

jobs:
  deploy-infra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add Hetzner to known hosts
        run: ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest infra changes
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            'cd /opt/decisionmesh/infra && git fetch origin main && git reset --hard origin/main'

      - name: Reload Caddy
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            'docker compose -f /opt/decisionmesh/infra/backend/docker-compose.gateway.yml restart'

      - name: Reload Prometheus
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            'docker compose -f /opt/decisionmesh/infra/backend/docker-compose.monitoring.yml up -d --force-recreate prometheus'

      - name: Reconnect networks
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            'docker network connect decisionmesh_internal decisionmesh-prometheus 2>/dev/null || true && docker network connect decisionmesh-staging_internal decisionmesh-prometheus 2>/dev/null || true && docker network connect decisionmesh_internal decisionmesh-grafana 2>/dev/null || true && docker network connect decisionmesh-staging_internal decisionmesh-grafana 2>/dev/null || true'

      - name: Verify health
        run: |
          sleep 15
          curl -sf https://api.decimeshi.com/health && echo "Prod API: OK" || echo "Prod API: WARN"
          curl -sf https://api-staging.decimeshi.com/health && echo "Staging API: OK" || echo "Staging API: WARN"
          echo "=== Infra deploy complete ==="
